<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="NEX terminal">
  <defs>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="720" height="360" rx="12" fill="url(#termBg)"/>
  <rect width="720" height="32" rx="12" fill="#334155"/>
  <rect y="20" width="720" height="12" fill="#334155"/>
  <circle cx="20" cy="16" r="6" fill="#ef4444"/>
  <circle cx="40" cy="16" r="6" fill="#f59e0b"/>
  <circle cx="60" cy="16" r="6" fill="#22c55e"/>
  <text x="360" y="21" font-family="Consolas, monospace" font-size="12" fill="#94a3b8" text-anchor="middle">nex run</text>
  <g font-family="Consolas, 'Cascadia Code', monospace" font-size="14" fill="#e2e8f0">
    <text x="20" y="60" fill="#94a3b8">$</text>
    <text x="36" y="60" fill="#e2e8f0">nex run</text>
    <text x="20" y="84" fill="#22c55e">compiled:</text>
    <text x="104" y="84" fill="#94a3b8">build/debug/tour.exe</text>
    <text x="20" y="116" fill="#e2e8f0">total = 15</text>
    <text x="20" y="140" fill="#e2e8f0">add(2, 3) = 5</text>
    <text x="20" y="164" fill="#e2e8f0">classify(-1) = 0</text>
    <text x="20" y="188" fill="#e2e8f0">classify(0) = 1</text>
    <text x="20" y="212" fill="#e2e8f0">classify(7) = 2</text>
    <text x="20" y="236" fill="#e2e8f0">3.9 as i64 = 3</text>
    <text x="20" y="272" fill="#94a3b8"># lexed → parsed → typed → NEX IR → LLVM IR → native exe</text>
  </g>
</svg>
