[workspace]
resolver = "3"
exclude = ["tools/studio_egui"]
members = [
    "compiler/diagnostics",
    "compiler/lexer",
    "compiler/ast",
    "compiler/parser",
    "compiler/semantic",
    "compiler/ir",
    "compiler/backend",
    "compiler/driver",
    "tools/cli",
    "tools/fmt",
    "tools/lint",
    "tools/studio",
    "tools/studio_native",
    "tests/integration",
]

[workspace.package]
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["NEX Engineering"]
repository = "https://github.com/cokovali10-sketch/NEX"

[workspace.dependencies]
nex-diagnostics = { path = "compiler/diagnostics" }
nex-lexer = { path = "compiler/lexer" }
nex-ast = { path = "compiler/ast" }
nex-parser = { path = "compiler/parser" }
nex-semantic = { path = "compiler/semantic" }
nex-ir = { path = "compiler/ir" }
nex-backend = { path = "compiler/backend" }
nex-driver = { path = "compiler/driver" }
nex-fmt = { path = "tools/fmt" }
nex-lint = { path = "tools/lint" }

[profile.release]
lto = "thin"
codegen-units = 1
