<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEX Studio</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --panel-2: #1c2330;
    --border: #2a3240;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #4493f8;
    --accent-2: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d29922;
    --radius: 10px;
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    --sans: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 80% -10%, #1b2638 0%, var(--bg) 60%);
    color: var(--fg);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(22, 27, 34, 0.8);
    backdrop-filter: blur(6px);
  }
  .logo {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #8957e5);
    display: grid; place-items: center;
    font-weight: 800; color: white; font-size: 18px;
    box-shadow: 0 4px 14px rgba(68,147,248,.35);
  }
  h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  .tag { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .spacer { flex: 1; }
  button {
    font-family: var(--sans);
    font-weight: 600;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--fg);
    padding: 9px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: .15s;
    font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), #6e7bf2);
    border: none; color: white;
    box-shadow: 0 4px 14px rgba(68,147,248,.4);
  }
  button.primary:hover { filter: brightness(1.08); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 14px;
    padding: 14px;
    min-height: 0;
  }
  .pane {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .pane-head {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .6px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .editor-wrap { flex: 1; position: relative; display: flex; min-height: 0; }
  .gutter {
    padding: 12px 10px;
    text-align: right;
    color: #495265;
    background: var(--panel-2);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    user-select: none;
    overflow: hidden;
    white-space: pre;
    min-width: 44px;
  }
  textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: var(--fg);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    padding: 12px 14px;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
  }
  #output {
    flex: 1;
    margin: 0;
    padding: 14px;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    overflow: auto;
    color: var(--fg);
  }
  .status {
    padding: 7px 14px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
    display: flex; gap: 16px; align-items: center;
  }
  .status .ok { color: var(--green); }
  .status .err { color: var(--red); }
  .status .run { color: var(--yellow); }
  kbd {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 1px 6px;
    font-size: 11px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }
</style>
</head>
<body>
  <header>
    <div class="logo">N</div>
    <div>
      <h1>NEX Studio <span class="tag">native playground</span></h1>
    </div>
    <div class="spacer"></div>
    <button id="example">Пример</button>
    <button id="clear">Очистить</button>
    <button id="run" class="primary">▶ Запустить</button>
  </header>

  <main>
    <section class="pane">
      <div class="pane-head"><span class="dot"></span> main.nex</div>
      <div class="editor-wrap">
        <div class="gutter" id="gutter">1</div>
        <textarea id="code" spellcheck="false"></textarea>
      </div>
      <div class="status">
        <span>NEX</span><span>UTF-8</span><span>4 spaces</span>
        <span class="spacer"></span>
        <span><kbd>Ctrl</kbd> + <kbd>Enter</kbd> — запустить</span>
      </div>
    </section>

    <section class="pane">
      <div class="pane-head"><span class="dot" style="background:var(--accent)"></span> Консоль</div>
      <pre id="output">Готов к работе. Нажми «Запустить».</pre>
      <div class="status" id="status"><span>ожидание</span></div>
    </section>
  </main>

<script>
const codeEl = document.getElementById('code');
const outEl = document.getElementById('output');
const gutterEl = document.getElementById('gutter');
const statusEl = document.getElementById('status');

const EXAMPLE = `struct Item:
    name: string
    price: i64

fn main():
    var cart: [Item] = []
    push(cart, Item("apple", 10))
    push(cart, Item("bread", 25))
    push(cart, Item("milk", 18))

    var total = 0
    for it in cart:
        println(it.name + ": " + to_string(it.price))
        total = total + it.price

    println("---")
    println("items: " + to_string(len(cart)))
    println("total: " + to_string(total))
`;

function updateGutter() {
  const lines = codeEl.value.split('\\n').length;
  let s = '';
  for (let i = 1; i <= lines; i++) s += i + '\\n';
  gutterEl.textContent = s;
  gutterEl.scrollTop = codeEl.scrollTop;
}
codeEl.addEventListener('input', updateGutter);
codeEl.addEventListener('scroll', () => { gutterEl.scrollTop = codeEl.scrollTop; });
codeEl.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = codeEl.selectionStart, en = codeEl.selectionEnd;
    codeEl.value = codeEl.value.slice(0, s) + '    ' + codeEl.value.slice(en);
    codeEl.selectionStart = codeEl.selectionEnd = s + 4;
    updateGutter();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
});

async function run() {
  statusEl.innerHTML = '<span class="run">● компиляция и запуск…</span>';
  outEl.textContent = 'Запуск…';
  try {
    const res = await fetch('/run', { method: 'POST', body: codeEl.value });
    const data = await res.json();
    outEl.textContent = (data.stdout || '') + (data.stderr ? ('\\n' + data.stderr) : '');
    const ok = data.exit === 0;
    statusEl.innerHTML = ok
      ? '<span class="ok">● готово (exit 0)</span>'
      : ('<span class="err">● ошибка (exit ' + data.exit + ')</span>');
  } catch (e) {
    outEl.textContent = 'Ошибка соединения с сервером: ' + e;
    statusEl.innerHTML = '<span class="err">● сбой</span>';
  }
}

document.getElementById('run').onclick = run;
document.getElementById('example').onclick = () => { codeEl.value = EXAMPLE; updateGutter(); };
document.getElementById('clear').onclick = () => { codeEl.value = ''; updateGutter(); };

codeEl.value = EXAMPLE;
updateGutter();
</script>
</body>
</html>
