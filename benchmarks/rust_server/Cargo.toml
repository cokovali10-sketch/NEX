[package]
name = "nex-bench-axum"
version = "0.1.0"
edition = "2021"

# Standalone crate: `cargo build --release` from this directory.
[workspace]

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
